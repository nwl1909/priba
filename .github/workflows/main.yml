name: Building

on: [push, pull_request, workflow_dispatch]

env:
  BUILD_CONFIGURATION: Release
  OUT_DIR: ${{ github.workspace }}/dist

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Build the managed projects directly (the native C++ project is not built here;
    # its DLLs come from ctfakrequirements.zip). Core is built as a project reference.
    - name: Build CLI
      run: dotnet build Interface/CTFAK.Cli/CTFAK.Cli.csproj -c ${{ env.BUILD_CONFIGURATION }} -o "${{ env.OUT_DIR }}"

    - name: Build plugins
      run: |
        dotnet build Plugins/CTFAK.Decompiler/CTFAK.Decompiler.csproj -c ${{ env.BUILD_CONFIGURATION }} -o "${{ env.OUT_DIR }}/Plugins"
        dotnet build Plugins/Dumper/Dumper.csproj -c ${{ env.BUILD_CONFIGURATION }} -o "${{ env.OUT_DIR }}/Plugins"

    # Plugins must only contain their own dll (shared deps are loaded from the CLI folder)
    - name: Clean plugin folder
      shell: pwsh
      run: |
        Get-ChildItem "${{ env.OUT_DIR }}/Plugins" -File |
          Where-Object { $_.Name -notin 'CTFAK.Decompiler.dll','CTFAK.Decompiler.pdb','Dumper.dll','Dumper.pdb' } |
          Remove-Item -Force
        Remove-Item "${{ env.OUT_DIR }}/Plugins/runtimes" -Recurse -Force -ErrorAction SilentlyContinue

    - name: Download required files
      shell: pwsh
      run: |
        Invoke-WebRequest "https://github.com/CTFAK/.github/raw/main/ctfakrequirements.zip" -OutFile req.zip
        Expand-Archive req.zip -DestinationPath "${{ env.OUT_DIR }}" -Force

    - name: Upload CTFAK (release)
      uses: actions/upload-artifact@v4
      with:
        name: CTFAK
        path: ${{ env.OUT_DIR }}
